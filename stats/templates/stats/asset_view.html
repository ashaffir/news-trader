{% extends 'core/base.html' %}
{% load static %}

{% block title %}{{ symbol }} on {{ date }}{% endblock %}

{% block extra_head %}
<style>
  .chart-card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid py-2">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h2 class="mb-0">{{ symbol }} - {{ date }}</h2>
      <div class="text-muted small">Intraday price chart</div>
    </div>
  </div>

  <div class="chart-card">
    <canvas id="chart-intraday" height="140"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<script>
(function(){
  async function load(){
    const res = await fetch(`/stats/api/asset-intraday?symbol={{ symbol }}&date={{ date }}`);
    const data = await res.json();
    const normalizeIso = (s) => {
      if (!s) return '';
      let x = String(s).trim();
      x = x.replace(' ', 'T');
      if (x.endsWith('+00:00')) x = x.slice(0, -6) + 'Z';
      return x;
    };
    const points = [];
    const labels = Array.isArray(data.labels) ? data.labels : [];
    const prices = Array.isArray(data.prices) ? data.prices : [];
    for (let i = 0; i < labels.length && i < prices.length; i++) {
      const t = Date.parse(normalizeIso(labels[i]));
      if (!isNaN(t)) points.push({ x: t, y: Number(prices[i]) });
    }
    const ctx = document.getElementById('chart-intraday').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: { datasets: [ { label: '{{ symbol }}', data: points, parsing: false, borderColor: '#0d6efd', pointRadius: 0 } ] },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } },
        scales: {
          x: { type: 'time', time: { unit: 'minute', tooltipFormat: 'MMM d HH:mm' }, ticks: { autoSkip: true, maxTicksLimit: 12 } },
          y: { title: { text: 'Price', display: true } }
        }
      }
    });
  }
  document.addEventListener('DOMContentLoaded', load);
})();
</script>
{% endblock %}
